<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Citizen Registration - AI Smart Civic Services</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#ccff80",
                        "primary-container": "#a3e635",
                        background: "#0e1513",
                        surface: "#0e1513",
                        "surface-container": "#1a211f",
                        "surface-variant": "#2f3634",
                        "on-surface": "#dde4e1",
                        "on-surface-variant": "#c2cab0",
                        "outline-variant": "#424936",
                        error: "#ffb4ab"
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #0e1513; color: #dde4e1; }
        .glass-card { background-color: #1a211f; border: 1px solid #424936; }
        .input-base { background-color: #0e1513; border: 1px solid #424936; color: #dde4e1; }
        .input-base:focus { border-color: #ccff80; outline: none; }
        .btn-primary { background-color: #a3e635; color: #0d0f0d; font-weight: 600; }
        .btn-primary:hover { background-color: #b2f746; }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col justify-center items-center p-4">
<div class="w-full max-w-md glass-card rounded-2xl p-8 flex flex-col gap-6 shadow-2xl">
<div class="text-center">
<div class="flex justify-center items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-4xl">account_balance</span>
<span class="font-extrabold text-2xl text-primary">AI Civic Portal</span>
</div>
<h1 class="text-xl font-bold text-on-surface">Create Citizen Account</h1>
<p class="text-xs text-on-surface-variant mt-1">Register to submit issues and track resolution progress.</p>
</div>

<div class="hidden p-3 rounded bg-rose-500/20 border border-rose-500/40 text-rose-300 text-xs" id="signup-error"></div>

<form id="citizen-signup-form" class="flex flex-col gap-4">
<div>
<label class="block text-xs font-semibold text-on-surface-variant mb-1">Full Name</label>
<input type="text" id="name" required class="input-base w-full px-4 py-3 rounded-lg text-sm" placeholder="Jane Doe"/>
</div>
<div>
<label class="block text-xs font-semibold text-on-surface-variant mb-1">Email Address</label>
<input type="email" id="email" required class="input-base w-full px-4 py-3 rounded-lg text-sm" placeholder="citizen@example.com"/>
</div>
<div>
<label class="block text-xs font-semibold text-on-surface-variant mb-1">Password (min. 6 characters)</label>
<input type="password" id="password" minlength="6" required class="input-base w-full px-4 py-3 rounded-lg text-sm" placeholder="••••••••"/>
</div>
<button type="submit" id="submit-btn" class="btn-primary w-full py-3 rounded-lg font-bold text-sm mt-2 flex justify-center items-center gap-2">
<span>Create Account</span>
<span class="material-symbols-outlined text-base">person_add</span>
</button>
</form>

<div class="text-center pt-4 border-t border-outline-variant/40">
<p class="text-xs text-on-surface-variant">Already have an account? <a href="/ui/citizen-login.html" class="text-primary font-bold hover:underline">Sign in here</a></p>
</div>
</div>

<script src="/ui/js/api.js"></script>
<script>
    document.getElementById('citizen-signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errDiv = document.getElementById('signup-error');
        const btn = document.getElementById('submit-btn');
        errDiv.classList.add('hidden');
        btn.disabled = true;
        btn.innerHTML = 'Registering...';

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
            const res = await apiRequest('/auth/signup', {
                method: 'POST',
                body: JSON.stringify({ name, email, password, role: 'citizen' })
            });

            localStorage.setItem('token', res.token);
            localStorage.setItem('role', res.role);
            localStorage.setItem('name', res.name);
            localStorage.setItem('email', res.email);

            window.location.href = '/ui/index.html';
        } catch (err) {
            errDiv.textContent = err.message || 'Registration failed. Try again.';
            errDiv.classList.remove('hidden');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<span>Create Account</span><span class="material-symbols-outlined text-base">person_add</span>';
        }
    });
</script>
</body>
</html>
